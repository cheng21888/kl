# 配置文件名称：.github/workflows/stock_auto_run.yml
name: 股票数据自动运行任务
on:
  # 手动触发：在GitHub仓库Actions页面可点击运行
  workflow_dispatch:
  # 定时任务：使用UTC时区，对应北京时间9:18和15:05
  schedule:
    # 竞价时间：UTC 01:18 → 北京时间 09:18
    - cron: '18 1 * * 1-5'
    # 收盘时间：UTC 07:05 → 北京时间 15:05
    # 注意：cron格式为 分 时 日 月 周，周1-5对应股市交易日
    - cron: '05 7 * * 1-5'

# 任务执行配置
jobs:
  run-stock-script:
    # 运行环境：选择最新的Ubuntu系统，兼容性好
    runs-on: ubuntu-latest
    # 任务步骤
    steps:
      # 步骤1：拉取当前仓库的代码到运行环境
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # 步骤2：配置Python环境（匹配你的代码运行版本，建议3.9+）
      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 可根据你的代码修改为3.9/3.11等
          cache: 'pip'  # 缓存pip包，加快后续运行速度

      # 步骤3：安装依赖库（easyquotation、pywencai及其他依赖）
      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install easyquotation pywencai
          # 若你的main.py还有其他依赖，在此添加，例如：
          # pip install pandas numpy requests

      # 步骤4：执行主代码main.py
      - name: 运行股票主程序
        run: python main.py
