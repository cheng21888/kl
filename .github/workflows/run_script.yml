# 工作流名称
name: Auto Run Stock Script
# 触发规则：工作日定时执行（竞价+收盘）
on:
  schedule:
    # 北京时间 09:18 → UTC 01:18，周一到周五
    - cron: '18 1 * * 1-5'
    # 北京时间 15:05 → UTC 07:05，周一到周五
    - cron: '05 7 * * 1-5'
  workflow_dispatch:  # 保留手动触发，方便调试

jobs:
  run-python-script:
    runs-on: ubuntu-latest  # 运行环境：Ubuntu最新版
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤2：配置系统时区（关键：确保Python时间为北京时间）
      - name: Set Timezone to Asia/Shanghai
        run: sudo timedatectl set-timezone Asia/Shanghai

      # 步骤3：配置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 推荐3.10+，兼容性好，可根据你的代码修改
          cache: 'pip'  # 自动缓存依赖，加速下次运行

      # 步骤4：安装依赖（若有requirements.txt则执行，无则可删除此步骤）
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      # 步骤5：运行主脚本main.py
      - name: Run Main Script
        env:
          TZ: 'Asia/Shanghai'  # 双重保障Python时区
        run: python main.py
